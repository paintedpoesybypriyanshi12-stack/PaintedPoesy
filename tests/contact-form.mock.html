<!doctype html>
<meta charset="utf-8">
<title>contact form mocked tests</title>
<iframe id="f" src="../index.html?t=0" width="900" height="900"></iframe>
<pre id="out">running</pre>
<script>
// MOCKED TESTS ONLY: window.fetch inside the site is replaced with a fake
// Web3Forms. Nothing is sent over the network and no email is delivered.
const out = document.getElementById("out");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const results = [];
function check(name, cond, detail) { results.push((cond ? "PASS " : "FAIL ") + name + (detail ? "  [" + detail + "]" : "")); }

document.getElementById("f").onload = async () => {
  const w = document.getElementById("f").contentWindow, d = w.document;
  const $ = s => d.querySelector(s);
  const form = $("#contact-form"), status = $("#c-status"), btn = $("#c-send");
  let calls = [], nextResponse = null, delay = 0;
  w.fetch = async (url, opts) => {
    calls.push({ url, body: JSON.parse(opts.body), headers: opts.headers });
    if (delay) await sleep(delay);
    return nextResponse();
  };
  // Stand-in for a completed hCaptcha (the real widget needs a human).
  w.hcaptcha = { reset() { w.__captchaReset = (w.__captchaReset || 0) + 1; } };
  let tok = d.querySelector('textarea[name="h-captcha-response"]');
  if (!tok) { tok = d.createElement("textarea"); tok.name = "h-captcha-response"; tok.hidden = true; form.appendChild(tok); }
  const cfg = w.SITE.web3forms;
  const json = (status, obj) => () => new w.Response(JSON.stringify(obj), { status, headers: { "Content-Type": "application/json" } });
  const fill = (n, e, m) => { $("#c-name").value = n; $("#c-email").value = e; $("#c-msg").value = m; };
  async function submitAndWait() {
    form.requestSubmit();
    for (let i = 0; i < 100 && (btn.disabled || form.getAttribute("aria-busy")); i++) await sleep(20);
    await sleep(20);
  }
  const reset = () => { calls = []; delay = 0; form.reset(); status.textContent = ""; tok.value = "tok-123"; cfg.accessKey = "TEST-KEY"; };
  d.querySelector("[data-contact]").click(); await sleep(80);   // open the pop-up like a visitor
  check("Contact Us opens the pop-up", $("#contact").open);

  // 1. empty form
  reset(); fill("", "", ""); await submitAndWait();
  check("empty form: no request sent", calls.length === 0);
  check("empty form: name/email/message errors shown",
    !$("#c-name-err").hidden && !$("#c-email-err").hidden && !$("#c-msg-err").hidden);
  check("empty form: aria-invalid set on fields", $("#c-name").getAttribute("aria-invalid") === "true");
  check("empty form: focus moved to first invalid field", d.activeElement === $("#c-name"), d.activeElement && d.activeElement.id);

  // 2. bad email format
  reset(); fill("Asha", "asha@nowhere", "Hello"); await submitAndWait();
  check("bad email: no request sent", calls.length === 0);
  check("bad email: email error shown", !$("#c-email-err").hidden && $("#c-name-err").hidden, $("#c-email-err").textContent);

  // 3. too long (bypassing maxlength as a script could)
  reset(); fill("Asha", "asha@example.com", "x".repeat(3001)); await submitAndWait();
  check("message over 3000 chars: blocked", calls.length === 0 && !$("#c-msg-err").hidden);
  check("input length limits present", $("#c-name").maxLength === 100 && $("#c-email").maxLength === 254 && $("#c-msg").maxLength === 3000);

  // 4. no access key configured
  reset(); cfg.accessKey = ""; fill("Asha", "asha@example.com", "Hello"); await submitAndWait();
  check("no access key: nothing sent, explains not connected", calls.length === 0 && /isn’t connected/.test(status.textContent));

  // 5. captcha not completed
  reset(); tok.value = ""; fill("Asha", "asha@example.com", "Hello"); await submitAndWait();
  check("captcha not completed: blocked with message", calls.length === 0 && !$("#c-captcha-err").hidden);

  // 6. success
  reset(); fill("Asha Rao", "asha@example.com", "I love Emerald.");
  nextResponse = json(200, { success: true, body: { message: "Email sent successfully!" } });
  await submitAndWait();
  const b = calls[0] && calls[0].body;
  check("success: exactly one request", calls.length === 1);
  check("success: posted to api.web3forms.com/submit", calls[0] && calls[0].url === "https://api.web3forms.com/submit");
  check("success: JSON headers", calls[0] && calls[0].headers["Content-Type"] === "application/json" && calls[0].headers.Accept === "application/json");
  check("payload: access_key", b && b.access_key === "TEST-KEY");
  check("payload: subject", b && b.subject === "New inquiry — Painted Poesy by Priyanshi", b && b.subject);
  check("payload: visitor address in `email` (Web3Forms Reply-To)", b && b.email === "asha@example.com");
  check("payload: from_name is the site, not the visitor", b && b.from_name === "Painted Poesy website");
  check("payload: only name/email/message from the visitor (no removed fields)", b && !("inquiry_type" in b) && !("artwork_of_interest" in b) && !("artwork" in b));
  check("form: inquiry type and artwork fields removed", !$("#c-type") && !$("#c-work"));
  check("payload: hCaptcha token forwarded", b && b["h-captcha-response"] === "tok-123");
  check("payload: no paid/unwanted fields", b && !("ccemail" in b) && !("attachment" in b) && !("botcheck" in b) && !("replyto" in b));
  check("success: exact success message", status.textContent === "Thank you for reaching out to Painted Poesy by Priyanshi. Your inquiry has been received, and I’ll be in touch soon.");
  check("success: form cleared", $("#c-name").value === "" && $("#c-msg").value === "");
  check("success: captcha reset for next use", (w.__captchaReset || 0) >= 1);

  const failCase = async (label, resp, opts = {}) => {
    reset(); fill("Asha", "asha@example.com", "Keep this text");
    if (opts.throwErr) nextResponse = () => { throw new TypeError("Failed to fetch"); }; else nextResponse = resp;
    await submitAndWait();
    check(label + ": failure message", status.textContent === "Your message couldn’t be sent. Please try again or email paintedpoesybypriyanshi12@gmail.com.", status.textContent);
    check(label + ": input preserved", $("#c-name").value === "Asha" && $("#c-msg").value === "Keep this text");
    check(label + ": button re-enabled", !btn.disabled && btn.textContent === "Send Inquiry");
  };
  // 7. HTTP 200 but service says success:false
  await failCase("200 with success:false", json(200, { success: false, body: { message: "Invalid access key" } }));
  // 8. HTTP 400
  await failCase("HTTP 400", json(400, { success: false, body: { message: "Error Description" } }));
  // 9. HTTP 429 rate limit
  await failCase("HTTP 429", json(429, { success: false, message: "Too may requests. Please try later!" }));
  // 10. HTTP 500 non-JSON
  await failCase("HTTP 500 non-JSON", () => new w.Response("<html>oops</html>", { status: 500 }));
  // 11. network error
  await failCase("network error", null, { throwErr: true });

  // 12. loading state + duplicate submit prevention
  reset(); fill("Asha", "asha@example.com", "Hi"); delay = 300;
  nextResponse = json(200, { success: true });
  form.requestSubmit(); await sleep(30);
  check("loading: button disabled and labelled while sending", btn.disabled && btn.textContent === "Sending your message…");
  check("loading: form marked aria-busy", form.getAttribute("aria-busy") === "true");
  form.requestSubmit(); form.requestSubmit();
  for (let i = 0; i < 60 && btn.disabled; i++) await sleep(20);
  check("double submit: only one request sent", calls.length === 1, "calls=" + calls.length);

  // 13. inquiring from a painting sends its name with the message
  reset(); $("#contact").close(); w.location.hash = "#/navarathna/ruby"; await sleep(120);
  d.querySelector("[data-inquire]").click(); await sleep(80);
  check("inquire from painting: heading names the painting", $("#contact-title").textContent === "A conversation about Ruby");
  fill("Asha", "asha@example.com", "About Ruby"); nextResponse = json(200, { success: true });
  await submitAndWait();
  check("inquire from painting: painting sent with the message", calls[0] && calls[0].body.artwork === "Ruby");
  // ...and the plain Contact Us button does not carry it over
  $("#contact").close(); w.location.hash = "#/"; await sleep(120);
  reset(); d.querySelector("[data-contact]").click(); await sleep(80);
  fill("Asha", "asha@example.com", "General"); nextResponse = json(200, { success: true });
  await submitAndWait();
  check("plain Contact Us: no painting attached", calls[0] && !("artwork" in calls[0].body));

  // 14. accessibility basics
  check("labels tied to inputs", ["c-name","c-email","c-msg"].every(id => d.querySelector(`label[for="${id}"]`)));
  check("errors linked via aria-describedby", $("#c-email").getAttribute("aria-describedby") === "c-email-err");
  check("status region is live", status.getAttribute("role") === "status");
  check("third-party notice present", /Web3Forms, a third-party form service/.test($(".form-actions small").textContent));

  const pass = results.filter(r => r.startsWith("PASS")).length;
  out.textContent = "RESULT " + pass + "/" + results.length + "\n" + results.join("\n");
  document.title = "done";
};
</script>
